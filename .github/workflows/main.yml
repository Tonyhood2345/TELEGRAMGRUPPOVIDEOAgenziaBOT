name: Bot Pubblicazione Immobiliare

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID univoco annuncio'
        required: false
        default: ''
      video_url:
        description: 'URL video sorgente'
        required: false
        default: ''
      seo_title:
        description: 'Titolo SEO'
        required: false
        default: ''
      seo_description:
        description: 'Descrizione SEO (Colonna F)'
        required: false
        default: ''
      seo_hashtags:
        description: 'Hashtag SEO'
        required: false
        default: ''
      indirizzo:
        description: 'Indirizzo immobile'
        required: false
        default: ''
      callback_url:
        description: 'URL callback DarIA'
        required: false
        default: ''
      existing_links:
        description: 'JSON con link gia pubblicati'
        required: false
        default: '{}'
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione pacchetti di sistema (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installazione dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp
          pip install requests gspread google-api-python-client google-auth-oauthlib

      - name: Esecuzione dello script Python
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
          YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
          YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          BOSS_PHONE: ${{ secrets.BOSS_PHONE }}
          INPUT_JOB_ID: ${{ github.event.inputs.job_id }}
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
          INPUT_SEO_TITLE: ${{ github.event.inputs.seo_title }}
          INPUT_SEO_DESCRIPTION: ${{ github.event.inputs.seo_description }}
          INPUT_SEO_HASHTAGS: ${{ github.event.inputs.seo_hashtags }}
          INPUT_INDIRIZZO: ${{ github.event.inputs.indirizzo }}
          INPUT_CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          INPUT_EXISTING_LINKS: ${{ github.event.inputs.existing_links }}
        run: python bot.py
