name: Test Crea Annuncio Singolo

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL del video di YouTube da elaborare'
        required: true
        default: 'https://www.youtube.com/watch?v=Cq0wg0_OeGg'
      wp_token:
        description: 'Token API WordPress (lascia vuoto se configurato nei Secrets del repo)'
        required: false
        default: ''
      groq_key:
        description: 'Groq API Key (lascia vuoto se configurato nei Secrets del repo)'
        required: false
        default: ''
      indirizzo:
        description: "Indirizzo dell'immobile (lascia vuoto per mappa agenzia)"
        required: false
        default: ""

jobs:
  crea-annuncio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Deno (richiesto da yt-dlp per decodifica YouTube)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Installazione FFmpeg (per estrazione fotogrammi HD)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installazione dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp requests

      - name: Esecuzione script di pubblicazione annuncio
        env:
          WP_TOKEN: ${{ github.event.inputs.wp_token || secrets.WP_TOKEN }}
          GROQ_API_KEY: ${{ github.event.inputs.groq_key || secrets.GROQ_API_KEY }}
          WP_URL: 'https://www.immobiliaregiancani.it/wp-json/easy-mcp-ai/v1/mcp'
          INPUT_INDIRIZZO: ${{ github.event.inputs.indirizzo }}
        run: python crea_annuncio_wp.py "${{ github.event.inputs.video_url }}"
