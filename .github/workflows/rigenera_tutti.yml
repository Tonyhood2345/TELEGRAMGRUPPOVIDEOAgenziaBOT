name: Rigenera Tutto il Portafoglio Immobili

on:
  workflow_dispatch:
    inputs:
      wp_token:
        description: 'Token API WordPress (lascia vuoto se configurato nei Secrets del repo)'
        required: false
        default: ''
      groq_key:
        description: 'Groq API Key (lascia vuoto se configurato nei Secrets del repo)'
        required: false
        default: ''

jobs:
  rigenera-tutto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Installazione FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installazione dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -U yt-dlp requests gspread google-auth

      - name: Esecuzione script di rigenerazione totale
        env:
          WP_TOKEN: ${{ github.event.inputs.wp_token || secrets.WP_TOKEN }}
          GROQ_API_KEY: ${{ github.event.inputs.groq_key || secrets.GROQ_API_KEY }}
          WP_URL: 'https://www.immobiliaregiancani.it/wp-json/easy-mcp-ai/v1/mcp'
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: python rigenera_tutti_gli_immobili.py

      - name: Commit e push di immobili.json aggiornato
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add immobili.json || true
          git commit -m "Update immobili.json [skip ci]" || true
          git push || true
