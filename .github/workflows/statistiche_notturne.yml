name: Bot Statistiche Notturno

# Si attiva in automatico alle 03:00 di notte (ora italiana)
# (0 2 * * * in cron equivale alle 2:00 UTC, che sono le 3:00/4:00 da noi)
on:
  schedule:
    - cron: '0 2 * * *'
  # Questo pulsante ti permette di avviarlo manualmente quando vuoi per testarlo!
  workflow_dispatch: 

jobs:
  aggiorna_statistiche:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il codice
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installa le librerie
      run: |
        python -m pip install --upgrade pip
        pip install requests gspread google-api-python-client google-auth

    - name: Esegui il Commercialista Notturno 🦉
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        YT_API_KEY: ${{ secrets.YT_API_KEY }}
      run: python bot_statistiche.py
