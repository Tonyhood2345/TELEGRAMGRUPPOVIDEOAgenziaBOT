name: Bot Pubblicazione Immobiliare

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 8 * * *' 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installazione pacchetti di sistema (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Installazione dipendenze Python
      run: |
        python -m pip install --upgrade pip
        # Forziamo l'aggiornamento immediato di yt-dlp all'ultima versione disponibile
        pip install -U yt-dlp 
        pip install requests gspread google-api-python-client google-auth-oauthlib

    - name: Esecuzione dello script Python
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        YT2_CLIENT_ID: ${{ secrets.YT2_CLIENT_ID }}
        YT2_CLIENT_SECRET: ${{ secrets.YT2_CLIENT_SECRET }}
        YT2_REFRESH_TOKEN: ${{ secrets.YT2_REFRESH_TOKEN }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      # Assicurati che lo script si chiami bot.py, altrimenti correggi qui sotto
      run: python bot.py
